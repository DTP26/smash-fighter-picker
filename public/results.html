
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Fighter Matches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Kanit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <p class="results-sub">
  </p>
 
  <div class="results-grid">
    <div class="results-container" id="resultsContainer"></div>
    <div class="compare-container" id = "compareContainer">
      <div class="matchup-grid--results" id="matchupGrid"></div>
      <div class="stat-list" id="statResults"></div>
      <div class="stat-list" id="overallScore"></div>
    </div>
    
  </div>
  
 
  <div class="submit-section">
    <a href="index.html" class="return-btn">Try Again?</a>
  </div>
 
  <script>
    // every stat the form can request, how to label it, and how to turn
    // its raw value into the same wording used on the form page
    const STAT_DEFS = {
      "run_speed" : {label: "Run Speed", values: { 1: "Fast", 0: "Average", "-1": "Slow" } },
      "initial_dash" : {label: "Initial Dash", values: { 1: "Fast", 0: "Average", "-1": "Slow" } },
      "air_speed" : {label: "Air Speed", values: { 1: "Fast", 0: "Average", "-1": "Slow" } },
      "air_acceleration": {label: "Air Acceleration", values: { 1: "Fast", 0: "Average", "-1": "Slow" } },
      "weight": { label: "Weight", values: { 1: "Heavy", 0: "Average", "-1": "Light" } },
      "normal_fall": {label: "Normal Fall Speed", values: { 1: "Fast-Faller", 0: "Average", "-1": "Floaty" } },
      "fast_fall": {label: "Fast Fall Speed", values: { 1: "Fast-Faller", 0: "Average", "-1": "Floaty" } },
      "fast_escape": {label: "Fast Escape Option", values: { "true": "Yes", "false": "No" } },
      "multiple_jumps": {label: "Multiple Double Jumps", values: { "true": "Yes", "false": "No" } },
      "anti_projectile": {label: "Anti Projectile Move", values: { "true": "Yes", "false": "No" } },
      "has_item": {label: "Has Item", values: { "true": "Yes", "false": "No" } },
      "has_zair": {label: "Has Zair", values: { "true": "Yes", "false": "No" } },
      "sig_change": {label: "Form/Moveset Change", values: { "true": "Yes", "false": "No" } },
      
        "effective_range":
        {label: "Effective Range",
        values: { 5: "Long Range", 4: "Long-Mid Range", 3: "Mid Range", 2: "Close-Mid Range", 1: "Close Range", 6: "Adaptive" }
      },
    };

    const results = JSON.parse(localStorage.getItem('results')) || [];
    const { attributeRequests = [], matchupRequests = {} } = JSON.parse(localStorage.getItem('requirements')) || {};
    const { attributes = [], matchups = {} } = JSON.parse(localStorage.getItem('information')) || {};
    const container = document.getElementById('resultsContainer');
    const grid = document.getElementById('matchupGrid');
    const attributeList = document.getElementById('statResults');
    const overallScore = document.getElementById('overallScore');

    let maxAttributeScore = 0;
    for (const attribute of attributeRequests) {
      maxAttributeScore += 1 * (1 + attribute.importance);
    }
    const maxMatchupScore = Object.keys(matchupRequests || {}).length;
    const maxTotalScore = maxAttributeScore + maxMatchupScore;

    if (attributeRequests.length == 0) {
      grid.style.height = "50vh";
      attributeList.style.height = "0vh";
      overallScore.style.height = "40vh";
    } else if (Object.keys(matchupRequests).length == 0) {
      grid.style.height = "0vh";
      attributeList.style.height = "50vh";
      overallScore.style.height = "40vh";
    } else {
      grid.style.height = "40vh";
      attributeList.style.height = "45vh";
      overallScore.style.height = "15vh";
    }
    
    let currSelected = null;
    console.log(attributeList);
 
    function formatValue(def, rawValue) {
      if (rawValue === undefined || rawValue === null) return "—";
      return def.values[rawValue] ?? String(rawValue);
    }
 
    // ===================================================================
    // Score groups
    // ===================================================================
 
    const GROUPS = [
      { state: "perfect",     title: "Supercalifragilisticexpialidocious!!!!", 
      blurb: "Essentially perfect unless you lied in the survey for some reason" },
      { state: "match",       title: "Very nice!",  
      blurb: "Strong matches outside of a couple areas. Certainly worth trying." },
      { state: "mid",         title: "I mean, it's aight",  
      blurb: "They missed a noticeable number of your requests, but may still be worth trying" },
      { state: "mismatch",    title: "I dunno...",    
      blurb: "They only match a small number of your requests. Likely aren't what you're looking for." },
      { state: "bigMismatch", title: "[LOUD INCORRECT BUZZER]",    
        blurb: "Basically the opposite of what you want. Stay away from these characters" },
    ];
 
    // Turns a score into a color state. Used by the stat chips AND by the
    // grouping below, so a character's group always matches its Overall chip.
    function scoreState(score, max) {
      if (max <= 0) return "neutral";        // nothing was requested in this category
      const ratio = score / max;
      if (ratio >= 0.9) return "perfect";
      else if (ratio >= 0.7) return "match";
      else if (ratio >= 0.5) return "mid";
      else if (ratio >= 0.25) return "mismatch";
      return "bigMismatch";
    }

    // converst number to rank (1 -> 1st, etc.) Assumes number between 1-89
    function numToRank(number) {

      
      let firstDigit = number % 10;
      const secondDigit = (number - firstDigit) / 10;
      let rank = "";

      if (number == 11 || number == 12 || number == 13) {
        return "" + secondDigit + firstDigit + "th";
      }

      switch (firstDigit) {
        case 1: 
          rank = "1st";
          break;
        case 2: 
          rank = "2nd";
          break;
        case 3: 
          rank = "3rd";
          break;
        default: 
          rank = firstDigit + "th";
      }
      
      if (secondDigit != 0) {
        rank = secondDigit + rank;
      }
      return rank;
    }
 
    // One character's card: portrait, name, and chips
    function buildCard(character, maxAttributeScore, maxMatchupScore) {
      const name = character.name;
 
      const card = document.createElement('div');
      card.className = 'fighter-card';
 
      const portrait = document.createElement('div');
      portrait.className = 'fighter-portrait';
 
      const img = document.createElement('img');
      const label = document.createElement('div');
      label.className = 'fighter-name';
 
      
      img.src = `/fighterRenders/${name}.png`;
      img.alt = name;
      label.textContent = character.name;
 
      portrait.appendChild(img);
      portrait.appendChild(label);
      card.appendChild(portrait);
      card.addEventListener("click", () =>{
        if (currSelected) {
          currSelected.dataset.state = "notSelected";
        } 
        card.dataset.state = "selected"
        currSelected = card;
        colorMatchupGrid(character);
        colorattributeList(character);
        colorScores(character);
      });
 
      return card;
    }
 
    // One group: a header (title, count, blurb) plus the cards that belong in it.
    // The size of its cards comes from the .results-group--<state> rule in styles.css.
    function buildGroup(group, members, maxAttributeScore, maxMatchupScore) {
      const section = document.createElement('section');
      section.className = `results-group results-group--${group.state}`;
 
      const header = document.createElement('div');
      header.className = 'results-group-header';
 
      const title = document.createElement('h2');
      title.className = 'results-group-title';
      title.id = `group-${group.state}`;
      title.textContent = group.title;
 
      const blurb = document.createElement('p');
      blurb.className = 'results-group-blurb';
      blurb.textContent = group.blurb;
 
      header.appendChild(title);
      header.appendChild(blurb);
 
      const cards = document.createElement('div');
      cards.className = 'results-group-cards';

      let rowGroup = document.createElement('div');
      rowGroup.className = 'fighter-row-group';
      let currRank = members[0].rank;
      let rankLabel = document.createElement('span');
      
      if (currRank == 1) {
        rankLabel.className = 'rank-label--first'
      } else if (currRank == 2) {
        rankLabel.className = 'rank-label--second'
      } else if (currRank == 3) {
        rankLabel.className = 'rank-label--third'
      } else {
        rankLabel.className = 'rank-label';
      }
      
      rankLabel.textContent = numToRank(currRank);
      members.forEach(character => {
        if (character.rank != currRank) {
          cards.appendChild(rankLabel);
          cards.appendChild(rowGroup);

          rowGroup = document.createElement('div');
          rowGroup.className = 'fighter-row-group';
          currRank = character.rank;
          
          rankLabel = document.createElement('span');
          if (currRank == 2) {
            rankLabel.className = 'rank-label--second'
          } else if (currRank == 3) {
            rankLabel.className = 'rank-label--third'
          } else {
            rankLabel.className = 'rank-label';
          }
          rankLabel.textContent = numToRank(currRank);
        }
        rowGroup.appendChild(buildCard(character, maxAttributeScore, maxMatchupScore));
      });

      // Append the final row
      if (rowGroup.children.length > 0) {
        cards.appendChild(rankLabel);
        cards.appendChild(rowGroup);
      }
 
      section.setAttribute('aria-labelledby', title.id);
      section.appendChild(header);
      section.appendChild(cards);
      return section;
    }

    function buildTile(fighter) {

    // each character has their icon placed on their own button
    const tile = document.createElement("div");
    tile.type = "button"; 
    tile.className = "matchup-tile--results";

    // edge case for pokemon trainer (combines squirtle, ivysaur, and charizard)
    if (fighter.id > 37 && fighter.id < 41) {
        if (fighter.id == 38) {
            tile.dataset.characterId = fighter.id;
            tile.title = "Pokemon Trainer";
        } else {
            return -1;
        }
    // edge case for pyra / mythra 
    } else if (fighter.id == 86 || fighter.id == 87) {
        if (fighter.id == 86) {
            tile.dataset.characterId = fighter.id;
            tile.title = "Pyra & Mythra";
        } else {
            return -1;
        }
    } else {
        tile.dataset.characterId = fighter.id;
        tile.title = fighter.name;
    }

    // sets title to display upon hover, initial status to unselected, and loads character icon
    tile.setAttribute("aria-label", tile.title);
    tile.setAttribute("aria-pressed", "false");

    const img = document.createElement("img");
    img.src = `/fighterIcons/${tile.title}.png`;
    img.alt = ""; // the button's aria-label already names it
    img.loading = "lazy";

    // If a file name doesn't match, show the name as text so it's obvious
    // which icon is missing instead of leaving a blank tile.
    img.addEventListener("error", () => {
    tile.classList.add("matchup-tile--noicon");
    tile.textContent = tile.title;
    });

    tile.appendChild(img);
    return tile;
  }

  /** sets the size of the results screen matchup grid based on 
   * the number of matchups the user requested**/
  function resizeMatchupGrid() {
    const tiles = [...grid.children];
    const tileCount = tiles.length;

    if (tileCount === 0) return;

    const gridWidth = grid.clientWidth - 8;
    const gridHeight = grid.clientHeight - 8;
    const gap = 4;

    let bestSize = 0;
    let bestColumns = 1;

    // Try every possible column count
    for (let columns = 1; columns <= tileCount; columns++) {
        const rows = Math.ceil(tileCount / columns);

        const tileWidth = (gridWidth - (columns - 1) * gap) / columns;
        const tileHeight = (gridHeight - (rows - 1) * gap) / rows;

        // Tiles must fit both horizontally and vertically
        const size = Math.min(tileWidth, tileHeight);

        if (size > bestSize) {
            bestSize = size;
            bestColumns = columns;
        }
    }

    grid.style.gridTemplateColumns =
        `repeat(${bestColumns}, ${bestSize}px)`;

    grid.style.gridAutoRows = `${bestSize}px`;
  }

  function colorMatchupGrid(fighter) {
    const fighterId = fighter.id;
    for (tile of grid.children) {
      const opponentID = parseInt(tile.dataset.characterId);
      const fighterOpinion = matchups[fighterId][opponentID];
      const opponentOpinion = matchups[opponentID][fighterId] * -1;
      const totalOpinion = fighterOpinion + opponentOpinion;
      if (fighterOpinion != opponentOpinion && totalOpinion == 0) {
        tile.dataset.state = "volatile";
      } else {
        switch (totalOpinion) {
          case 2: 
            tile.dataset.state = "winning";
            break;
          case 1: 
            tile.dataset.state = "winning/even";
            break; 
          case 0: 
            tile.dataset.state = "even";
            break;
          case -1: 
            tile.dataset.state = "even/losing";
            break; 
          case -2: 
            tile.dataset.state = "losing";
            break;
          default:
            tile.dataset.state = "neutral";
        }
      }
    }
  }
  function colorattributeList(fighter) {
    let i = 0;
    for (row of attributeList.children) {
      for (chip of row.children) {
        const def = STAT_DEFS[chip.dataset.attributeId];
        const charValue = attributes[fighter.id - 1][chip.dataset.attributeId];
        const requestedValue = parseInt(attributeRequests[i]["value"]);
        if (chip.dataset.attributeId == "effective_range") {
          console.log(charValue);
          console.log(requestedValue);
        }
        let state = 'neutral';
        if (charValue == requestedValue) {
          state = 'match';
        } else if (Math.abs(charValue - requestedValue) == 1 && !attributeRequests[i]["isToggle"]) {
          state = 'mid';
        } else {
          state = "bigMismatch";
        }
        chip.className = `stat-chip stat-chip--${state}`;

        chip.children[1].textContent = def["values"][charValue];
        i+= 1;
      }
    }
  }

  function colorScores(fighter) {
    const totalScore = document.getElementById("totalChip");
    totalScore.className = `stat-chip stat-chip--${scoreState(fighter.totalScore, maxTotalScore)}`;

    const totalValue = document.getElementById("totalValue");
    totalValue.textContent = `${fighter.totalScore} / ${maxTotalScore}`;

    if (maxAttributeScore > 0 && maxMatchupScore > 0) {
      const matchupChip = document.getElementById("matchupsChip");
      matchupChip.className = `stat-chip stat-chip--${scoreState(fighter.matchupScore, maxMatchupScore)}`;

      const matchupValue = document.getElementById("matchupsValue");
      matchupValue.textContent = `${fighter.matchupScore} / ${maxMatchupScore}`;

      const attributeChip = document.getElementById("attributesChip");
      attributeChip.className = `stat-chip stat-chip--${scoreState(fighter.attributeScore, maxAttributeScore)}`;

      const attributeValue = document.getElementById("attributesValue");
      attributeValue.textContent = `${fighter.attributeScore} / ${maxAttributeScore}`;
    }
  }

  // splits `total` items into rows of at most `maxPerRow`, keeping row
  // sizes as even as possible and handing any remainder to the middle
  // row(s) first so the block reads as a centered pyramid rather than
  // a lopsided or orphaned last row (e.g. 13 items, max 5 -> 4, 5, 4)
  function balancedRowSizes(total, maxPerRow) {
    const rows = Math.max(1, Math.ceil(total / maxPerRow));
    const base = Math.floor(total / rows);
    let remainder = total - base * rows;
    const sizes = new Array(rows).fill(base);
    const mid = Math.floor(rows / 2);
    let step = 0;
    while (remainder > 0) {
      const idx = step % 2 === 0
        ? mid + Math.floor((step + 1) / 2)
        : mid - Math.floor((step + 1) / 2);
      sizes[idx] += 1;
      remainder -= 1;
      step += 1;
    }
    return sizes;
  }
 
    (async () => {
      
      /**console.log(attributeRequests);
      console.log(matchupRequests);
      console.log(attributes);**/
 
      // the best score a character could possibly earn for what the user asked for
      
 
      // sort every character into a group by overall score. results arrive
      // sorted best-first, so each group keeps that order
      const buckets = new Map(GROUPS.map(group => [group.state, []]));
      results.forEach(character => {
        let state = scoreState(character.totalScore, maxTotalScore);
        if (state === "neutral") state = "perfect"; // only happens if nothing was requested
        buckets.get(state).push(character);
      });
 
      // one section per group, skipping any group nobody landed in
      GROUPS.forEach(group => {
        const members = buckets.get(group.state);
        if (members.length > 0) {
          container.appendChild(buildGroup(group, members, maxAttributeScore, maxMatchupScore, attributes, matchups));
        }
      });

      // creates the results grid of matchups
      try {
        // separates miis from id order to add them to the end (mimics select screen)
        const miis = new Set();

        for (const [id, request] of Object.entries(matchupRequests)) {
            const fighter = attributes[parseInt(id) - 1];
            const tile = buildTile(fighter);
            if (tile != -1) {
                if (tile.title.includes("Mii")) {
                    miis.add(tile);
                } else {
                    grid.appendChild(tile);
                }
            }     
        };

        miis.forEach(mii => grid.appendChild(mii));
            
      } catch (err) {
        console.error(err);
        grid.textContent = "Couldn't load the character list.";
        return;
      }

      let cursor = 0;
      const rowSizes = balancedRowSizes(attributeRequests.length, 4);
      // creates the resulting stat list
      rowSizes.forEach(size => {
        const rowGroup = document.createElement('div');
        rowGroup.className = 'stat-row-group';
        attributeRequests.slice(cursor, cursor + size).forEach(attribute => {
          let def = STAT_DEFS[attribute.name];
          const chip = document.createElement('div');
          chip.className = `stat-chip stat-chip--${"neutral"}`;
          chip.dataset.attributeId = attribute.name;

          const label = document.createElement('span');
          label.className = 'stat-chip-label';
          label.textContent = def.label;

          const value = document.createElement('span');
          value.className = 'stat-chip-value';
          value.textContent = "";

          chip.appendChild(label);
          chip.appendChild(value);
          rowGroup.appendChild(chip);
        });
        attributeList.appendChild(rowGroup);
        cursor += size;
      });
      // overall score setup

      const scoreRow = document.createElement('div');
      scoreRow.className = 'score-row-group';

      // only show seperate scores if both are relevant
      if (maxAttributeScore > 0 && maxMatchupScore > 0) {
        // matchup score

        const matchupsChip = document.createElement('div');
        matchupsChip.className = `stat-chip stat-chip--${"neutral"}`;
        matchupsChip.id = "matchupsChip"
  
        const matchupsLabel = document.createElement('span');
        matchupsLabel.className = 'stat-chip-label';
        matchupsLabel.textContent = "Matchups";
  
        const matchupsValue = document.createElement('span');
        matchupsValue.className = 'stat-chip-value';
        matchupsValue.textContent = "";
        matchupsValue.id = "matchupsValue"
  
        matchupsChip.appendChild(matchupsLabel);
        matchupsChip.appendChild(matchupsValue);

        //attribute score

        const attributesChip = document.createElement('div');
        attributesChip.className = `stat-chip stat-chip--${"neutral"}`;
        attributesChip.id = "attributesChip"
  
        const attributesLabel = document.createElement('span');
        attributesLabel.className = 'stat-chip-label';
        attributesLabel.textContent = "Attributes";
  
        const attributesValue = document.createElement('span');
        attributesValue.className = 'stat-chip-value';
        attributesValue.textContent = "";
        attributesValue.id = "attributesValue"

        attributesChip.appendChild(attributesLabel);
        attributesChip.appendChild(attributesValue);

        scoreRow.appendChild(matchupsChip);
        scoreRow.appendChild(attributesChip);
      }

      // total score

      const totalChip = document.createElement('div');
      totalChip.className = `stat-chip stat-chip--${"neutral"}`;
      totalChip.id = "totalChip";
 
      const totalLabel = document.createElement('span');
      totalLabel.className = 'stat-chip-label';
      totalLabel.textContent = "Total Score";
 
      const totalValue = document.createElement('span');
      totalValue.className = 'stat-chip-value';
      totalValue.textContent = "";
      totalValue.id = "totalValue";

      totalChip.appendChild(totalLabel);
      totalChip.appendChild(totalValue);
      scoreRow.append(totalChip);

      overallScore.appendChild(scoreRow);

      
      resizeMatchupGrid(grid);
      window.addEventListener("resize", resizeMatchupGrid);
      
    })();
  </script>
